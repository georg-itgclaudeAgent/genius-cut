<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"How an email gets authenticated"},
  {"id":"steps","type":"string","label":"Steps","default":"mail=You send|server=Server signs|shield=Inbox checks"},
  {"id":"accent","type":"color","label":"Accent","default":"#FF7A51"}
]'>
  <head>
    <meta charset="UTF-8" />
    <!-- itGenius explainer scene: full screen. A solid Deep Navy background fills the whole frame edge to edge (the
         blue angled-edge wedge is a decorative accent inside it, never the frame's outline), a title, then 2-4 nodes (an icon in a circle + a label)
         joined by arrows, appearing one after another across the length so each lands on its spoken words.
         `steps` is "icon=Label|icon=Label|…"; icons are the files in assets/icons/ (check, cross, shield, lock, key,
         mail, user, cloud, server, phone, globe, alert, chart, arrow-right, star, gear). Change `beats` below to
         put each node on a transcript time (seconds from the graphic's start). The last node gets the accent
         ring. Everything leaves before the end. Works at 1920x1080 and 1080x1920 (nodes stack).
         Minimum sizes at 1080p (keep them when adapting): title 64 px, labels and body 34 px, icons 96 px. -->
    <link rel="stylesheet" href="assets/tokens.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit-Variable.ttf") format("truetype");
                   font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Outfit"; color: #FFFFFF; }
      #bg { position: absolute; inset: 0; background: #112A33; }
      #wedge { position: absolute; right: 0; top: 0; bottom: 0; width: 120px; background: #009BD0;
               clip-path: polygon(60% 0, 100% 0, 100% 100%, 0 100%); }
      #content { position: absolute; inset: 120px; display: flex; flex-direction: column; justify-content: center;
                 align-items: center; gap: 72px; }
      #title { display: block; font-weight: 700; font-size: 80px; line-height: 92px; text-align: center;
               letter-spacing: -0.01em; }
      #flow { display: flex; align-items: center; justify-content: center; gap: 28px; }
      .node { display: flex; flex-direction: column; align-items: center; gap: 26px; width: 330px; }
      .ring { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 190px; height: 190px;
              border-radius: 50%; background: #009BD0; }
      .node.last .ring { background: var(--accent, #FF7A51); }
      .ring img { display: block; width: 112px; height: 112px; }
      .label { font-weight: 300; font-size: 44px; line-height: 52px; text-align: center; }
      .arrow { flex: 0 0 auto; display: block; width: 64px; height: 10px; background: #FFFFFF; position: relative; }
      .arrow::after { content: ""; position: absolute; right: -6px; top: -11px; border-left: 24px solid #FFFFFF;
                      border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
      #root.tall #flow { flex-direction: column; align-items: flex-start; gap: 24px; }
      #root.tall .node { flex-direction: row; width: auto; gap: 36px; }
      #root.tall .label { text-align: left; max-width: 560px; }
      #root.tall .arrow { width: 10px; height: 56px; margin-left: 90px; }
      #root.tall .arrow::after { right: -11px; top: auto; bottom: -6px; border-left: 16px solid transparent;
                                 border-right: 16px solid transparent; border-top: 24px solid #FFFFFF; border-bottom: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080"
         data-fps="30">
      <div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="bg"></div>
        <div id="wedge"></div>
        <div id="content">
          <div id="title" data-var-text="title">How an email gets authenticated</div>
          <div id="flow"></div>
        </div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const root = document.getElementById("root");
      const D = Number(root.dataset.duration);
      if (Number(root.dataset.height) > Number(root.dataset.width)) root.classList.add("tall");
      const ICONS = ["check", "cross", "shield", "lock", "key", "mail", "user", "cloud", "server", "phone", "globe",
                     "alert", "chart", "arrow-right", "star", "gear"];
      const steps = String(v.steps).split("|").map(s => s.trim()).filter(Boolean).slice(0, 4).map(s => {
        const i = s.indexOf("=");
        const icon = i > 0 ? s.slice(0, i).trim() : "check";
        return { icon: ICONS.includes(icon) ? icon : "check", label: i > 0 ? s.slice(i + 1).trim() : s };
      });
      const flow = document.getElementById("flow");
      const nodes = [], arrows = [];
      steps.forEach((step, i) => {
        if (i) { const a = document.createElement("div"); a.className = "arrow"; a.id = "arrow" + i;
                 flow.appendChild(a); arrows.push(a); }
        const n = document.createElement("div");
        n.className = "node" + (i === steps.length - 1 ? " last" : "");
        n.id = "node" + i;
        const ring = document.createElement("div");
        ring.className = "ring";
        const img = document.createElement("img");
        img.src = "assets/icons/" + step.icon + ".svg";
        img.alt = step.icon;
        ring.appendChild(img);
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = step.label;
        n.appendChild(ring);
        n.appendChild(label);
        flow.appendChild(n);
        nodes.push(n);
      });
      // When each node appears (seconds from the start): spread evenly between 1.0 s and the exit.
      const out = Math.max(2.5, D - 0.8);
      const gap = (out - 1.6) / Math.max(1, nodes.length);
      const beats = nodes.map((_, i) => 1.0 + i * gap);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { clipPath: "polygon(0 0, 0 0, 0 100%, 0 100%)" },
                { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)", duration: 0.55, ease: "power3.out" }, 0)
        .fromTo("#wedge", { xPercent: 100 }, { xPercent: 0, duration: 0.5, ease: "power3.out" }, 0.1)
        .fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.35);
      nodes.forEach((n, i) => {
        if (i) tl.fromTo(arrows[i - 1], { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, beats[i] - 0.25);
        tl.fromTo(n.querySelector(".ring"), { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, beats[i])
          .fromTo(n.querySelector(".label"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, beats[i] + 0.15);
      });
      tl.to("#content", { opacity: 0, duration: 0.3, ease: "power2.in" }, out)
        .to("#wedge", { xPercent: 100, duration: 0.35, ease: "power3.in" }, out + 0.1)
        .to("#bg", { clipPath: "polygon(100% 0, 100% 0, 100% 100%, 100% 100%)", duration: 0.4, ease: "power3.in" }, out + 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
