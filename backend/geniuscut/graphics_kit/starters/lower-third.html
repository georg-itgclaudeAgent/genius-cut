<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Turn on MFA"},
  {"id":"subtitle","type":"string","label":"Subtitle","default":"Two-step sign-in for every account"},
  {"id":"accent","type":"color","label":"Accent bar","default":"#FF7A51"}
]'>
  <head>
    <meta charset="UTF-8" />
    <!-- itGenius lower third: navy panel with the angled edge, blue wedge, coral bar. Bottom-left, 120 px safe
         margins; enters in ~0.6 s (power3.out) and slides back out before the end. Works at 1920x1080 and
         1080x1920. -->
    <link rel="stylesheet" href="assets/tokens.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit-Variable.ttf") format("truetype");
                   font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Outfit"; }
      #card { position: absolute; left: 120px; right: 120px; bottom: 150px; height: 190px; }
      #panel { position: absolute; left: 0; top: 0; height: 190px; width: min(980px, 100%); background: #112A33;
               clip-path: polygon(0 0, 100% 0, calc(100% - 70px) 100%, 0 100%); }
      #wedge { position: absolute; left: -26px; top: 0; height: 190px; width: 120px; background: #009BD0;
               clip-path: polygon(0 0, 100% 0, calc(100% - 46px) 100%, 0 100%); }
      #bar { position: absolute; left: 130px; top: 128px; height: 8px; width: 120px; background: var(--accent, #FF7A51); }
      #titleMask { position: absolute; left: 130px; top: 26px; height: 92px; overflow: hidden;
                   width: calc(min(980px, 100%) - 220px); }
      #title { display: block; color: #FFFFFF; font-weight: 700; font-size: 72px; line-height: 92px;
               letter-spacing: -0.01em; white-space: nowrap; }
      #subtitle { position: absolute; left: 130px; top: 142px; width: calc(min(980px, 100%) - 220px);
                  color: #FFFFFF; font-weight: 300; font-size: 32px; line-height: 38px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080"
         data-fps="30">
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="panel"></div>
        <div id="wedge"></div>
        <div id="bar"></div>
        <div id="titleMask"><div id="title" data-var-text="title">Turn on MFA</div></div>
        <div id="subtitle" data-var-text="subtitle">Two-step sign-in for every account</div>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const D = Number(root.dataset.duration);       // the length the engine set
      const out = Math.max(1.2, D - 0.65);           // exit starts here and ends before D
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#panel", { clipPath: "polygon(0 0, 0 0, -70px 100%, 0 100%)" },
                { clipPath: "polygon(0 0, 100% 0, calc(100% - 70px) 100%, 0 100%)", duration: 0.55, ease: "power3.out" }, 0)
        .fromTo("#wedge", { xPercent: -120 }, { xPercent: 0, duration: 0.45, ease: "power3.out" }, 0.05)
        .fromTo("#title", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, 0.3)
        .fromTo("#bar", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.55)
        .fromTo("#subtitle", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.7)
        .to(["#title", "#subtitle", "#bar"], { opacity: 0, duration: 0.25, ease: "power2.in" }, out)
        .to("#panel", { clipPath: "polygon(0 0, 0 0, -70px 100%, 0 100%)", duration: 0.4, ease: "power3.in" }, out + 0.15)
        .to("#wedge", { xPercent: -120, duration: 0.35, ease: "power3.in" }, out + 0.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
