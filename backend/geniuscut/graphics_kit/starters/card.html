<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Email authentication"},
  {"id":"mode","type":"enum","label":"Layout","default":"list","options":[
    {"value":"list","label":"List"},{"value":"steps","label":"Numbered steps"},
    {"value":"comparison","label":"Comparison (two columns)"},{"value":"chart","label":"Bar chart"}]},
  {"id":"items","type":"string","label":"Items","default":"SPF: who may send|DKIM: the message is signed|DMARC: what to do with failures"},
  {"id":"accent","type":"color","label":"Accent","default":"#FF7A51"}
]'>
  <head>
    <meta charset="UTF-8" />
    <!-- itGenius full-screen card: Deep Navy background that wipes in on the angled edge, a Bold title with a
         coral bar, then the items one by one (0.12 s apart). `items` by mode:
           list / steps: "first|second|third" (2-5 items; steps are numbered)
           comparison:   "Left heading;point;point||Right heading;point;point"
           chart:        "Label=42|Label=17|Label=8" (bars scale to the largest value; numbers shown)
         Everything wipes away before the end. Works at 1920x1080 and 1080x1920.
         Full screen: the solid Deep Navy background fills the whole frame edge to edge (the blue angled-edge wedge
         is a decorative accent inside it, never the frame's outline). Minimum sizes at 1080p (keep them when
         adapting): title 64 px, items, labels and body 34 px. -->
    <link rel="stylesheet" href="assets/tokens.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit-Variable.ttf") format("truetype");
                   font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Outfit"; color: #FFFFFF; }
      #bg { position: absolute; inset: 0; background: #112A33; }
      #wedge { position: absolute; right: 0; top: 0; bottom: 0; width: 18%; background: #009BD0;
               clip-path: polygon(70% 0, 100% 0, 100% 100%, 0 100%); }
      #content { position: absolute; inset: 120px; display: flex; flex-direction: column; justify-content: center;
                 gap: 48px; padding-right: 12%; }
      #title { display: block; font-weight: 700; font-size: 84px; line-height: 96px; letter-spacing: -0.01em; }
      #bar { display: block; width: 140px; height: 10px; margin-top: 22px; background: var(--accent, #FF7A51); }
      #items { display: flex; flex-direction: column; gap: 28px; }
      .item { display: flex; align-items: baseline; gap: 26px; font-weight: 300; font-size: 44px; line-height: 54px; }
      .dot { flex: 0 0 auto; display: block; width: 18px; height: 18px; background: #009BD0; transform: translateY(-6px); }
      .num { flex: 0 0 auto; font-weight: 700; font-size: 44px; color: var(--accent, #FF7A51); min-width: 1.2em; }
      .cols { display: flex; gap: 64px; }
      .col { flex: 1 1 0; display: flex; flex-direction: column; gap: 22px; }
      .col h2 { font-weight: 700; font-size: 52px; line-height: 62px; padding-bottom: 14px;
                border-bottom: 6px solid #009BD0; }
      .col.right h2 { border-bottom-color: var(--accent, #FF7A51); }
      .col p { font-weight: 300; font-size: 40px; line-height: 50px; }
      .row { display: flex; align-items: center; gap: 28px; }
      .label { flex: 0 0 26%; font-weight: 300; font-size: 40px; line-height: 50px; }
      .track { flex: 1 1 auto; height: 54px; }
      .fill { display: block; height: 54px; background: #009BD0; }
      .row.top .fill { background: var(--accent, #FF7A51); }
      .val { flex: 0 0 auto; font-weight: 700; font-size: 44px; min-width: 2.5em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080"
         data-fps="30">
      <div id="card" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="bg"></div>
        <div id="wedge"></div>
        <div id="content">
          <div id="head"><div id="title" data-var-text="title">Email authentication</div><div id="bar"></div></div>
          <div id="items"></div>
        </div>
      </div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      const D = Number(document.getElementById("root").dataset.duration);
      const box = document.getElementById("items");
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
                                       if (text !== undefined) e.textContent = text; return e; };
      const parts = String(v.items).split("|").map(s => s.trim()).filter(Boolean);
      let reveal = [];
      if (v.mode === "comparison") {
        const cols = el("div", "cols");
        String(v.items).split("||").slice(0, 2).forEach((group, c) => {
          const [head, ...points] = group.split(";").map(s => s.trim()).filter(Boolean);
          const col = el("div", "col" + (c ? " right" : ""));
          col.appendChild(el("h2", "", head || ""));
          points.forEach(p => col.appendChild(el("p", "", p)));
          cols.appendChild(col);
          reveal.push(...col.children);
        });
        box.appendChild(cols);
      } else if (v.mode === "chart") {
        const rows = parts.map(p => { const i = p.lastIndexOf("="); return [p.slice(0, i).trim(), Number(p.slice(i + 1))]; });
        const max = Math.max(...rows.map(r => r[1]), 1);
        rows.forEach(([label, value], i) => {
          const row = el("div", "row" + (value === max ? " top" : ""));
          row.appendChild(el("div", "label", label));
          const track = el("div", "track");
          const fill = el("div", "fill");
          fill.style.width = (100 * value / max) + "%";
          track.appendChild(fill);
          row.appendChild(track);
          row.appendChild(el("div", "val", String(value)));
          box.appendChild(row);
          reveal.push(row);
        });
      } else {
        parts.forEach((p, i) => {
          const row = el("div", "item");
          row.appendChild(v.mode === "steps" ? el("span", "num", String(i + 1)) : el("span", "dot"));
          row.appendChild(el("span", "", p));
          box.appendChild(row);
          reveal.push(row);
        });
      }
      const out = Math.max(2, D - 0.7);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { clipPath: "polygon(0 0, 0 0, 0 100%, 0 100%)" },
                { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)", duration: 0.55, ease: "power3.out" }, 0)
        .fromTo("#wedge", { xPercent: 100 }, { xPercent: 0, duration: 0.5, ease: "power3.out" }, 0.1)
        .fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3)
        .fromTo("#bar", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.5)
        .fromTo(reveal, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, 0.7);
      if (v.mode === "chart") {
        tl.fromTo(".fill", { scaleX: 0, transformOrigin: "left center" },
                  { scaleX: 1, duration: 0.6, ease: "power3.out", stagger: 0.12 }, 0.8);
      }
      tl.to("#content", { opacity: 0, duration: 0.25, ease: "power2.in" }, out)
        .to("#wedge", { xPercent: 100, duration: 0.35, ease: "power3.in" }, out + 0.1)
        .to("#bg", { clipPath: "polygon(100% 0, 100% 0, 100% 100%, 100% 100%)", duration: 0.4, ease: "power3.in" }, out + 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
